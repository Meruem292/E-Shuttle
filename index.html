<!doctype html>
<html lang="en" class="h-full bg-[#E3F2FD] text-slate-800">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>E-Shuttle — Official</title>
    <meta name="description" content="Mobile-first e-bike ride hailing and shuttle service. Book official E-Shuttle rides, locate designated stations, track drivers live, and request rides." />
    <meta name="theme-color" content="#0D47A1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-Shuttle" />

    <!-- Icons and Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/official_logo.jpg" />
    <link rel="shortcut icon" href="/official_logo.jpg" />
    <link rel="apple-touch-icon" href="/official_logo.jpg" />

    <!-- Open Graph / Facebook / Messenger / WhatsApp / iMessage / Discord Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-Shuttle" />
    <meta property="og:title" content="E-Shuttle — Official E-Bike Shuttle Service" />
    <meta property="og:description" content="Mobile-first e-bike ride hailing and shuttle service. Book official E-Shuttle rides, locate designated stations, and request rides." />
    <meta property="og:image" content="/official_logo.jpg" />
    <meta property="og:image:secure_url" content="/official_logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="E-Shuttle Logo" />

    <!-- Twitter Card Link Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Shuttle — Official E-Bike Shuttle Service" />
    <meta name="twitter:description" content="Mobile-first e-bike ride hailing and shuttle service. Book official E-Shuttle rides, locate designated stations, and request rides." />
    <meta name="twitter:image" content="/official_logo.jpg" />
    <meta name="twitter:image:alt" content="E-Shuttle Logo" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="h-full antialiased bg-[#E3F2FD] text-slate-800 selection:bg-[#2196F3] selection:text-white overflow-x-hidden font-sans">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
